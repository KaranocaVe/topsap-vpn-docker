name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to publish
        required: false
        type: string
      lockhash:
        description: Optional packages.lock.json hash suffix (without lock-)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to publish
        required: false
        type: string
      lockhash:
        description: Optional packages.lock.json hash suffix (without lock-)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: topsap-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/karanocave/topsap-vpn-docker

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: none
      actions: read
    steps:
      - name: Check out publish ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  build:
    name: Build and smoke (${{ matrix.arch }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out publish ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: false
          sbom: false
      - name: Pull published digest for smoke checks
        run: docker pull "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Run credential-free smoke checks
        run: .github/scripts/smoke-image.sh "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Save image digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > "digest-${{ matrix.arch }}.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: topsap-digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out publish ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Download architecture digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: topsap-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish manifest tags
        env:
          LOCKHASH_INPUT: ${{ inputs.lockhash }}
        run: |
          set -Eeuo pipefail
          target_sha=$(git rev-parse HEAD)
          amd64_digest=$(cat digests/digest-amd64.txt)
          arm64_digest=$(cat digests/digest-arm64.txt)
          test "${amd64_digest#sha256:}" != "$amd64_digest"
          test "${arm64_digest#sha256:}" != "$arm64_digest"

          lockhash="$LOCKHASH_INPUT"
          if [[ -z "$lockhash" && -f packages.lock.json ]]; then
            lockhash=$(sha256sum packages.lock.json | cut -c1-16)
          fi

          tags=(--tag "$IMAGE:sha-${target_sha}")
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ -n "$remote_main" && "$target_sha" == "$remote_main" ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          if [[ -n "$lockhash" ]]; then
            tags+=(--tag "$IMAGE:lock-${lockhash}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "$IMAGE@${amd64_digest}" \
            "$IMAGE@${arm64_digest}"
          docker buildx imagetools inspect "$IMAGE:sha-${target_sha}"
