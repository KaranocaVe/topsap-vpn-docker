name: Diagnose upstream connectivity
on:
  workflow_dispatch:
permissions: {}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - shell: bash
        run: curl -4 -I --connect-timeout 10 --max-time 20 https://app.topsec.com.cn/
  warp:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install official Cloudflare client
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main' | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
      - name: Check official endpoint through WARP
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          warp-cli --accept-tos status
          curl -I --proxy socks5h://127.0.0.1:40000 --connect-timeout 15 --max-time 30 https://app.topsec.com.cn/
      - if: always()
        run: warp-cli --accept-tos disconnect || true
