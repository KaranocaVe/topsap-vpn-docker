name: Diagnose upstream connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download and verify both official packages through public proxies
        run: |
          python3 scripts/upstream.py download --arch amd64 --output /tmp/topsap-amd64.deb --public-proxy
          python3 scripts/upstream.py download --arch arm64 --output /tmp/topsap-arm64.deb --public-proxy
      - if: always()
        run: rm -f /tmp/topsap-amd64.deb /tmp/topsap-arm64.deb
